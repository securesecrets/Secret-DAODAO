[package]
name ="cw-payroll-factory"
authors = ["Jake Hartnell"]
description = "A CosmWasm factory contract for instantiating a payroll contract."
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# for more explicit tests, cargo test --features=backtraces
backtraces = ["cosmwasm-std/backtraces"]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-std = { workspace = true }
cosmwasm-schema = { workspace = true }
cw-denom = { workspace = true }
cw-ownable = { workspace = true }
secret-storage-plus = { workspace = true }
secret-cw2 = { workspace = true }
thiserror = { workspace = true }
cw-vesting = { workspace = true, features = ["library"] }
secret-utils = { workspace = true }
serde ={ workspace = true }
schemars ={ workspace = true }
snip20-reference-impl  = { workspace = true}
secret-toolkit ={ workspace = true }

[dev-dependencies]
secret-multi-test = { workspace = true }
snip20-reference-impl  = { workspace = true}
wynd-utils = { workspace = true }
